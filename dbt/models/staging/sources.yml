version: 2

sources:
  - name: raw
    description: Raw landing tables loaded directly by the ingestion scripts.
    schema: public
    tables:
      - name: raw_papers
        description: One row per arXiv paper, as pulled by ingestion/arxiv_client.py
        columns:
          - name: arxiv_id
            tests:
              - unique
              - not_null
      - name: authors
      - name: paper_authors
      - name: paper_citations
      - name: ingestion_log
      - name: enrichment_log